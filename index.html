<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Facegram — Clean photo & social sharing combining Instagram aesthetics with expressive Facebook interactions." />
  <title>Facegram</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%231877F2'/%3E%3Cstop offset='35%25' stop-color='%239B37F2'/%3E%3Cstop offset='70%25' stop-color='%23E1306C'/%3E%3Cstop offset='100%25' stop-color='%23F77737'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='url(%23g)'/%3E%3Cpath d='M36.5 21.5h5v-7.5h-6.2c-6.8 0-10.8 4.1-10.8 10.6v4.4H19v7.2h5.5V52h8.2V36.2h6.1l1.1-7.2h-7.2v-3.7c0-2.4 1.1-3.8 3.8-3.8z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Storage Quota Warning Banner -->
  <div id="storage-error-banner" class="storage-banner hidden" role="alert">
    <div class="storage-banner-content">
      <span id="storage-error-text">Browser storage quota reached. Some media or changes could not be saved.</span>
      <div class="storage-banner-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-action="dismiss-storage-banner">Dismiss</button>
      </div>
    </div>
  </div>

  <!-- Application Shell -->
  <div id="app" class="app-root">
    <header id="nav-root"></header>
    <main id="main-root" class="main-stage" aria-live="polite"></main>
  </div>

  <!-- Modal & Overlay Root -->
  <div id="modal-root"></div>

  <!-- Toast Notification Root -->
  <div id="toast-root" class="toast-container" aria-live="assertive"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
